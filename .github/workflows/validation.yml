# Offline validation only: no MetaTrader, broker, account, secret or network
# access beyond installing pinned packages. PROJECT_SPEC section 16 (CI).
name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # Reference runtime of the frozen native indicator fixtures.
          python-version: "3.14.4"
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.4.4" "pandas==3.0.2" "requests==2.34.2" "pytest==9.1.1"
      - name: Documentation lint
        run: python -B scripts/check_docs.py
      - name: Generated native fixtures are current
        run: |
          python -B scripts/generate_native_closed_bar_fixtures.py --check
          python -B scripts/generate_native_core_indicator_fixtures.py --check
          python -B scripts/generate_native_risk_gate_fixtures.py --check
      - name: C++ emulation of pure native modules
        run: python -B scripts/run_native_cpp_emulation.py
      - name: Python test suite
        run: python -B -m pytest -p no:cacheprovider -rf
